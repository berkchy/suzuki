name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cached)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure Android SDK packages
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null
          fi

      - name: Compute version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
              > keystore.properties
          fi

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease --build-cache --stacktrace \
            -PversionName=${{ steps.ver.outputs.name }} \
            -PversionCode=${{ steps.ver.outputs.code }}

      - name: Collect artifacts
        env:
          NAME: ${{ steps.ver.outputs.name }}
        run: |
          mkdir -p dist
          ARM64=$(find app/build/outputs/apk/release -maxdepth 1 -name '*-arm64-v8a-*.apk' | head -n 1)
          ARM32=$(find app/build/outputs/apk/release -maxdepth 1 -name '*-armeabi-v7a-*.apk' | head -n 1)
          test -n "$ARM64" && test -n "$ARM32"
          cp "$ARM64" "dist/suzuki-${NAME}-arm64-v8a.apk"
          cp "$ARM32" "dist/suzuki-${NAME}-armeabi-v7a.apk"
          cp "$ARM64" "dist/suzuki-latest-arm64-v8a.apk"
          cp "$ARM32" "dist/suzuki-latest-armeabi-v7a.apk"
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: suzuki-apk
          path: dist/*.apk
          retention-days: 14

      - name: Publish continuous release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view continuous > /dev/null 2>&1 || \
            gh release create continuous --title "Continuous build" \
              --notes "main dalından otomatik derleme" --prerelease --target main
          gh release upload continuous \
            dist/suzuki-latest-arm64-v8a.apk \
            dist/suzuki-latest-armeabi-v7a.apk --clobber
          gh release edit continuous \
            --notes "Son otomatik derleme: ${GITHUB_SHA::7} • build #${GITHUB_RUN_NUMBER}"

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/suzuki-${{ steps.ver.outputs.name }}-*.apk
          generate_release_notes: true
